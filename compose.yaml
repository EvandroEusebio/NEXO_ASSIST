services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexo_assist
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_local_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_assist"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
